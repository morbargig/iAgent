name: 🚀 Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

concurrency:
  group: render-backend-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
  NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
  NX_CLOUD_NO_ACCESS: "true"
  NX_SKIP_CLOUD_CACHE: "true"

jobs:
  deploy-backend:
    name: 🚀 Deploy Backend to Render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --prefer-offline --no-audit --production=false

      - name: Build backend
        run: npx nx build @iagent/backend --configuration=production --no-cloud

      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ env.RENDER_DEPLOY_HOOK }}?clearCache=true"
