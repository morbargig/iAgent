name: 🚀 Deploy to GitHub Pages

on:
  # Deploy on push to main branch (after CI passes)
  push:
    branches: [main]

  # Allow manual deployment
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  # GitHub Pages configuration
  BASE_URL: "/iAgent/"
  # Disable Nx Cloud completely
  NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
  NX_CLOUD_NO_ACCESS: "true"
  NX_SKIP_CLOUD_CACHE: "true"

jobs:
  deploy:
    name: 🚀 Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Required permissions for GitHub Pages deployment
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧭 Set Nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --production=false

      - name: 🔍 Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: 🧭 Check if frontend is affected
        id: affected
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: deploying frontend"
            exit 0
          fi

          AFFECTED_PROJECTS="$(npm exec nx -- show projects --affected --base="$NX_BASE" --head="$NX_HEAD")"
          echo "Affected projects:"
          echo "$AFFECTED_PROJECTS"

          if echo "$AFFECTED_PROJECTS" | grep -Fxq "@iagent/frontend"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏗️ Build frontend for production
        if: steps.affected.outputs.affected == 'true'
        run: npm exec nx -- build @iagent/frontend --configuration=production --no-cloud
        env:
          # GitHub Pages specific environment variables
          VITE_BASE_URL: ${{ env.BASE_URL }}
          VITE_API_BASE_URL: https://iagent-k0dx.onrender.com/api
          VITE_BASE_API_URL: https://iagent-k0dx.onrender.com/api
          VITE_ENABLE_MOCK_MODE: "false"
          VITE_ENVIRONMENT: production
          NODE_ENV: production
          NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
          NX_SKIP_CLOUD_CACHE: "true"
          NX_CLOUD_NO_ACCESS: "true"

      - name: 📊 Verify build output
        if: steps.affected.outputs.affected == 'true'
        run: |
          echo "📊 Build verification:"
          echo "📁 Build directory: dist/apps/frontend"
          echo "📏 Total size: $(du -sh dist/apps/frontend)"

          # Check if required files exist
          if [[ -f "dist/apps/frontend/index.html" ]]; then
            echo "✅ index.html exists"
          else
            echo "❌ index.html missing"
            exit 1
          fi

          # List main files
          echo "📄 Main files:"
          ls -la dist/apps/frontend

      - name: 🔧 Prepare deployment files
        if: steps.affected.outputs.affected == 'true'
        run: |
          cd dist/apps/frontend

          # Create .nojekyll to bypass Jekyll processing
          touch .nojekyll

          # Create robots.txt for SEO
          cat > robots.txt << EOF
          User-agent: *
          Allow: /
          Sitemap: https://${{ github.repository_owner }}.github.io${{ env.BASE_URL }}sitemap.xml
          EOF

          # Create a simple 404 page that redirects to index
          cat > 404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <script>
              // Redirect to index.html for SPA routing
              window.location.href = '/iAgent/';
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="/iAgent/">iAgent</a>...</p>
          </body>
          </html>
          EOF

          echo "✅ Deployment files prepared"

      - name: 🚀 Deploy to GitHub Pages
        if: steps.affected.outputs.affected == 'true'
        id: deployment
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/apps/frontend
          # Do not set CNAME as we want the default GitHub Pages URL

      - name: 📋 Deployment summary
        if: steps.affected.outputs.affected == 'true'
        run: |
          echo "📋 Deployment Summary:"
          echo "✅ Frontend deployed successfully!"
          echo "🌐 URL: https://${{ github.repository_owner }}.github.io/iAgent/"
          echo "📊 Build size: $(du -sh dist/apps/frontend)"
          echo "🕐 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Triggered by: ${{ github.actor }}"

      - name: 🌐 Verify deployment
        if: steps.affected.outputs.affected == 'true'
        run: |
          echo "🌐 Verifying deployment accessibility..."
          DEPLOYMENT_URL="https://${{ github.repository_owner }}.github.io/iAgent/"

          # Wait for deployment to propagate
          echo "⏳ Waiting 30 seconds for deployment to propagate..."
          sleep 30

          # Test basic connectivity
          if curl -sL --fail "$DEPLOYMENT_URL" > /dev/null; then
            echo "✅ Deployment is accessible!"
            echo "🎉 Visit your app at: $DEPLOYMENT_URL"
          else
            echo "⚠️ Deployment verification inconclusive"
            echo "🌐 Please check manually: $DEPLOYMENT_URL"
            echo "ℹ️ It may take a few minutes for GitHub Pages to update"
          fi

      - name: ⏭️ Skip deployment summary
        if: steps.affected.outputs.affected != 'true'
        run: echo "Frontend is not affected; skipping deployment."
