name: 🔍 Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
  NX_CLOUD_NO_ACCESS: "true"
  NX_SKIP_CLOUD_CACHE: "true"

jobs:
  quality:
    name: 🧹 Affected Quality & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧭 Set Nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: 🧹 Lint affected projects
        continue-on-error: true
        run: |
          npm exec nx -- affected -t lint --base="$NX_BASE" --head="$NX_HEAD" --skip-nx-cache
          echo "✅ Affected lint completed"

      - name: 🔧 Typecheck affected projects
        run: npm exec nx -- affected -t typecheck --base="$NX_BASE" --head="$NX_HEAD" --skip-nx-cache

  test:
    name: 🧪 Affected Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧭 Set Nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: 🧪 Test affected projects
        run: npm exec nx -- affected -t test --base="$NX_BASE" --head="$NX_HEAD" --passWithNoTests --skip-nx-cache
        env:
          CI: true
          NX_CLOUD_DISTRIBUTED_EXECUTION: "false"

      - name: 📊 Upload frontend coverage
        if: ${{ hashFiles('coverage/apps/frontend/**') != '' }}
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage/apps/frontend
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  build:
    name: 🏗️ Affected Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧭 Set Nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: 🏗️ Build affected projects
        run: npm exec nx -- affected -t build --base="$NX_BASE" --head="$NX_HEAD" --configuration=production --skip-nx-cache
        env:
          VITE_BASE_URL: "/iAgent/"
          VITE_API_BASE_URL: "/iAgent/api"
          VITE_ENVIRONMENT: "production"
          NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
          NX_SKIP_CLOUD_CACHE: "true"
          NX_CLOUD_NO_ACCESS: "true"

      - name: 📊 Analyze frontend build size
        if: ${{ hashFiles('dist/apps/frontend/index.html') != '' }}
        run: |
          echo "📊 Frontend build analysis:"
          du -sh dist/apps/frontend
          echo "📄 Main files:"
          find dist/apps/frontend -name "*.js" -o -name "*.css" | head -10

      - name: 📋 Upload frontend build artifact
        if: ${{ hashFiles('dist/apps/frontend/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/apps/frontend
          retention-days: 7

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=high --no-fund

  ci-success:
    name: ✅ CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [quality, test, build, security]
    if: always()

    steps:
      - name: ✅ All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "✅ All CI checks passed successfully!"
          echo "🎉 Code is ready for deployment!"

      - name: ❌ Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "❌ Some CI checks failed!"
          echo "🔍 Please review the failed jobs and fix issues."
          exit 1
